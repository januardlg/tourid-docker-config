version: '3.8'

# Docker Compose for Staging Environment (VPS Style)
# This configuration uses .env.staging files for all services
# Simulates production-like deployment on VPS

services:
  # Frontend Service (Next.js) - Staging
  tourid_fe_staging:
    build:
      context: ../tourid-next-project
      dockerfile: Dockerfile
    image: ${TOURID_FE_IMAGE}
    container_name: ${TOURID_FE_CONTAINER_NAME}
    ports:
      - "8081:8080" # Different port to avoid dev conflicts
    env_file:
      - ./tourid-next-project/.env.staging
    environment:
      # Override the value found in .env.development
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://tourid_be_staging:3000 #docker network
    depends_on:
      - tourid_be_staging
    restart: always
    # Production-style settings
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Backend Service (Express.js) - Staging
  tourid_be_staging:
    build:
      context: ../tourid-express-typesript
      dockerfile: Dockerfile
    image: ${TOURID_BE_IMAGE}
    container_name: ${TOURID_BE_CONTAINER_NAME}
    ports:
      - "3001:3000" # Different port to avoid dev conflicts
    env_file:
      - ./tourid-express-typesript/.env.staging
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://tourid:password@tourid_postgres_staging_db:5432/tourid_data_staging
    depends_on:
      - tourid_postgres_staging_db
    restart: always
    # Production-style settings
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Database Service (PostgreSQL) - Staging
  tourid_postgres_staging_db:
    image: ${POSTGRES_IMAGE}
    container_name: ${POSTGRES_CONTAINER_NAME}
    ports:
      - "5433:5432" # Different port to avoid dev conflicts
    environment:
      POSTGRES_USER: tourid
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tourid_data_staging
    volumes:
      - tourid_staging_data_volume:/var/lib/postgresql/data
    restart: always
    # Production-style health check
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U tourid -d tourid_data_staging" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Production-style settings
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

volumes:
  tourid_staging_data_volume:
